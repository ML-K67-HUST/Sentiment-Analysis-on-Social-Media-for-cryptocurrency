# Lightweight Development Profile
# Use this for development when you need less resource usage
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.dev-lite.yml up -d

services:
  # Only run backend API + minimal consumers
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiman_backend_api_lite
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: development
    networks:
      - sentiman-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
