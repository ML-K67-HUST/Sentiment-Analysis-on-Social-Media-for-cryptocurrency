# Monitoring Stack (Kafka UI + Grafana + Prometheus)
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.monitoring.yml up -d

volumes:
  prometheus_data:
  grafana_data:

services:
  # ===========================================================================
  # KAFKA UI - Monitor Kafka Topics & Consumers
  # ===========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentiman_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentiman-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_CLIENT_ID: kafka-ui
      KAFKA_CLUSTERS_0_SHOW_CLUSTER_CONFIGURATION_INTERNAL: 'false'
      KAFKA_CLUSTERS_0_SHOW_CONSUMER_GROUPS_INTERNAL: 'false' 
      DYNAMIC_CONFIG_ENABLED: 'true'
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_PROVECTUS: DEBUG
      SERVER_PORT: 8080
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # PROMETHEUS - Metrics Collector
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sentiman_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # GRAFANA - Visualization & Dashboards
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: sentiman_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # MONGODB EXPORTER - Export MongoDB Metrics to Prometheus
  # ===========================================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: sentiman_mongodb_exporter
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017
    command:
      - '--mongodb.uri=mongodb://admin:password@mongodb:27017'
      - '--collect-all'
    networks:
      - sentiman-net

  # ===========================================================================
  # CONSUMER METRICS API - Custom Metrics Endpoint
  # ===========================================================================
  consumer-metrics-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sentiman_backend:latest
    container_name: sentiman_consumer_metrics
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-blog-data}
    command: python -m uvicorn services.metrics_exporter:app --host 0.0.0.0 --port 8003
    networks:
      - sentiman-net
