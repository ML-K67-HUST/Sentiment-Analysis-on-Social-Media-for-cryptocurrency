<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <title>DS</title>
</head>
<body>
    <div class="nav">
        <a href="https://github.com/ML-K67-HUST/Sentiment-Analysis-on-Social-Media-for-cryptocurrency" target="_blank">Sentiment Analysis On Cryptorency</a>
        <p>Group 18</p>
    </div>
    <div class="main">
        <div class="item left">
            <div class="left-header">
                <div class="bitcoin">
                    <div class="bitcoin-upper">
                        <img class="btc-icon" src="https://www.cryptocompare.com/media/37746251/btc.png" style="width: 40px; height: 40px;">
                        <p class="btc">Bitcoin</p>
                        <p class="abbre">BTC</p>
                    </div>
                    <div class="bitcoin-lower">
                        <p class="price">Fetching bitcoin price</p>
                        <div class="status">
                            <img class="status-icon" src="style/assets/arrow_drop_up_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.svg">
                            <p class="status-text">Fetching bitcoin movemment</p>
                        </div>
                    </div>
                </div>
                <div class="positive-rate">
                    <div class="positive-upper">
                        <p class="pst">Positive rate</p>
                    </div>
                    <div class="positive-lower">
                        <p class="rate">Fetching positive rate%</p>
                        <div class="pst-status">
                            <img class="trend" src="style/assets/trending_up_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.svg">
                            <p class="pst-status-text">Positive</p>
                        </div>
                    </div>
                </div>
                <div class="ml-predict">
                    <div class="ml-upper">
                        <p class="ml">ML Prediction</p>
                    </div>
                    <div class="ml-lower">
                        <p class="predict">Fetching prediction</p>
                    </div>
                    <div class="pst-status">
                        <p class="pst-status-text">Latest training time : 2 days ago</p>
                    </div>
                </div>
            </div>
            <div class="left-chart">
                <label for"options">Choose a date</label>
                <select id="options" name="options">
                    <option value="option-1">Last day</option> 
                    <option value="option-2">Three day ago</option> 
                    <option value="option-3">One week ago</option> 
                    <option value="option-4">One month ago</option> 
                </select>
                <canvas id="bitcoinChart"></canvas>
            </div>
        </div>
        <div class="item right">
            <div class="news-nav">
                <p data-source="CoinMarketCap" class="nav-item">CoinMarketCap</a>
                <p data-source="X" class="nav-item">X</p>
            </div>
            <div class="load-news" id="newsContainer">
                
            </div>
        </div>
    </div>
    <script src="news.js"></script>
    <script src="status_ml.js"></script>
    <script src="status_btc.js"></script>
    <script src="chart.js"></script>
    <script src="status_positive.js"></script>
</body>
</html>
