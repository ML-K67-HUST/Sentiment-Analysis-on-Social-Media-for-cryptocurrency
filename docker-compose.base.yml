# Base Infrastructure with Wurstmeister Kafka (SIMPLE & PROVEN!)
#usage: docker-compose -f docker-compose.base.yml up -d

volumes:
  mongo_data:
  kafka_data:

networks:
  sentiman-net:
    driver: bridge

services:
  # MONGODB
  mongodb:
    image: mongo:7.0
    container_name: sentiman_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-blog-data}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ZOOKEEPER (for Kafka)
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: sentiman_zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    networks:
      - sentiman-net

  # KAFKA (Wurstmeister - simple & proven!)
  kafka:
    image: wurstmeister/kafka:latest
    container_name: sentiman_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    volumes:
      - kafka_data:/kafka
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
