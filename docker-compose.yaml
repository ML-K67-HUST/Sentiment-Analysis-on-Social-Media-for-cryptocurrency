# =============================================================================
# Sentiment Analysis on Social Media for Cryptocurrency
# Main Docker Compose File - One Command to Rule Them All
# Usage: docker-compose up -d
# =============================================================================

networks:
  sentiman-net:
    name: sentiman-net
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  kafka_data:
  zookeeper_data:
  mlflow_postgres_data:
  minio_data:
  airflow_logs:
  airflow_plugins:

services:
  # ===========================================================================
  # DATABASE SERVICES
  # ===========================================================================
  
  mongodb:
    image: mongo:6
    container_name: sentiman_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - sentiman-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ===========================================================================
  # MESSAGE QUEUE - KAFKA STACK
  # ===========================================================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentiman_zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      # Persist ZK state so cluster.id stays consistent across restarts
      - zookeeper_data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentiman_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # ⚠️ CRITICAL: DO NOT CHANGE PORT MAPPINGS after first run!
      # Changing ports will cause InconsistentClusterIdException
      - "9094:9092"  # EXTERNAL listener
      - "9095:9093"  # EXTERNAL listener (backup)
    environment:
      # ⚠️ CRITICAL CONFIG - DO NOT CHANGE AFTER FIRST RUN!
      # These values are written to Kafka metadata in volume.
      # Changing them will cause cluster ID mismatch and startup failure.
      # If you need to change, DELETE the volume first: docker volume rm sentiman_kafka_data
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # INTERNAL: For Docker services (airflow, backend, etc.) -> kafka:9092
      # EXTERNAL: For host machine access -> localhost:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Safe to change (not stored in metadata):
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-4073741824}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
    volumes:
      # ⚠️ If Kafka fails with InconsistentClusterIdException, delete this volume:
      # docker volume rm sentiman_kafka_data
      - kafka_data:/var/lib/kafka/data
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ===========================================================================
  # ML EXPERIMENT TRACKING - MLFLOW STACK
  # ===========================================================================
  
  mlflow-postgres:
    image: postgres:15
    container_name: sentiman_mlflow_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow123}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: sentiman_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: sentiman_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb myminio/mlflow --ignore-existing;
      mc anonymous set download myminio/mlflow;
      exit 0;
      "
    networks:
      - sentiman-net

  mlflow:
    build:
      context: ./mlflow/mlflow
      dockerfile: Dockerfile
    image: sentiman_mlflow_server
    container_name: sentiman_mlflow
    restart: unless-stopped
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: 'true'
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_POSTGRES_USER:-mlflow}:${MLFLOW_POSTGRES_PASSWORD:-mlflow123}@mlflow-postgres:5432/mlflow
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
      --artifacts-destination s3://mlflow
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # WORKFLOW ORCHESTRATION - AIRFLOW
  # ===========================================================================
  
  airflow-postgres:
    image: postgres:15
    container_name: sentiman_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-redis:
    image: redis:latest
    container_name: sentiman_airflow_redis
    restart: unless-stopped
    expose:
      - 6379
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: sentiman_airflow:latest
    container_name: sentiman_airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-redis:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      # Application environment variables
      URL_MONGODB: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      DB_NAME_ORAICHAIN: ${MONGODB_DATABASE:-blog-data}
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      COINRANKING_API_KEY: ${COINRANKING_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins}
        exec /entrypoint airflow version
    networks:
      - sentiman-net

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: sentiman_airflow:latest
    container_name: sentiman_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: sentiman_airflow:latest
    container_name: sentiman_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-worker:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: sentiman_airflow:latest
    container_name: sentiman_airflow_worker
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
      - sentiman-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================
  
  # ML Prediction API Service
  backend-ml-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sentiman_backend:latest
    container_name: sentiman_backend_ml
    restart: unless-stopped
    working_dir: /src
    command: python -m uvicorn services.ml_api:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      mlflow:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # MLflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # MongoDB
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-blog-data}
    volumes:
      - ./airflow/dags/services/scaler.pkl:/src/services/scaler.pkl
      - ./airflow/dags/services/tfidf_vectorizer.pkl:/src/services/tfidf_vectorizer.pkl
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sentiman_backend:latest
    container_name: sentiman_backend_consumerdock
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # MongoDB
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-blog-data}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-coinmarketcap-news}
      # LLM Provider
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      # Bitcoin Data
      COINRANKING_API_KEY: ${COINRANKING_API_KEY:?COINRANKING_API_KEY is required}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: python consumer.py
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # NLP Feature Engineering Consumer
  backend-nlp-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sentiman_backend:latest
    container_name: sentiman_nlp_consumer
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # MongoDB
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-blog-data}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-coinmarketcap-news}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: python nlp_consumer.py
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sentiman_backend:latest
    container_name: sentiman_backend_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # MongoDB
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING:-mongodb://admin:password@mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-blog-data}
      # Bitcoin Data API
      COINRANKING_API_KEY: ${COINRANKING_API_KEY:?COINRANKING_API_KEY is required}
      # LLM Provider for Sentiment Analysis
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: uvicorn services.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - sentiman-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

